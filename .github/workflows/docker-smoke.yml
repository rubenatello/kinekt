name: Docker Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-build:
    name: Docker Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python-version }} -t kinekt:ci .

      - name: Smoke test image
        run: docker run --rm kinekt:ci --help

      - name: Build test target
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python-version }} --target test -t kinekt:test .

      - name: Run tests in image
        run: docker run --rm kinekt:test
