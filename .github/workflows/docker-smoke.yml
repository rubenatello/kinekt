name: Docker Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kinekt:ci .

      - name: Smoke test image
        run: docker run --rm kinekt:ci --help
