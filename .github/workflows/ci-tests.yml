name: CI Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Static quality and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install locked dependencies
        run: uv sync --locked --python 3.11 --extra dev --extra mcp

      - name: Lint
        run: uv run --locked python -m ruff check src tests scripts

      - name: Type check
        run: uv run --locked python -m mypy src/kinekt

      - name: Coverage
        run: uv run --locked python -m pytest --cov=kinekt --cov-report=term-missing --cov-fail-under=75

      - name: Audit locked environment
        run: uv run --locked pip-audit --local

  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra mcp

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --locked python -m pytest -q

      - name: Enforce retrieval quality
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --locked python scripts/check_retrieval_eval.py

  package:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install locked package tooling
        run: uv sync --locked --python 3.11 --extra dev

      - name: Build, inspect, and clean-install artifacts
        run: uv run --locked python scripts/check_package.py
